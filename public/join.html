
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giờ ra chơi - Người chơi</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#102b23;color:#f8efd9;font-family:Georgia,serif}
.wrap{max-width:560px;margin:auto;padding:20px}
.brand{text-align:center;color:#e4c477;font-size:30px;font-weight:bold}
.sub{text-align:center;font-size:13px;letter-spacing:2px;margin-top:6px}
.card{background:#1d4738;border:3px solid #c9a65d;border-radius:18px;padding:22px;margin-top:22px}
h2{color:#f8efd9}
label{display:block;margin:16px 0 8px;color:#e4c477}
input,select{width:100%;padding:14px;border-radius:9px;border:1px solid #c9a65d;background:#fff8e7;color:#20382c;font-size:16px}
button{cursor:pointer}
.btn{width:100%;padding:15px;margin-top:20px;border:0;border-radius:10px;background:#e4c477;color:#20382c;font-size:17px;font-weight:bold}
.btn:disabled{opacity:.5;cursor:not-allowed}
.option{width:100%;display:block;text-align:left;background:#f8efd9;color:#20382c;padding:14px;margin:10px 0;border:3px solid transparent;border-radius:10px;font-size:16px}
.option.selected{border-color:#e4c477;background:#d7e9cc}
.status{margin-top:15px;padding:13px;border-radius:9px;background:#ead8a8;color:#20382c;line-height:1.5}
.hidden{display:none}
.small{font-size:13px;line-height:1.6;color:#c8d5c9}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">GIỜ RA CHƠI</div>
  <div class="sub">ĐẤU TRÍ BẢNG PHẤN · ĐIỆN THOẠI</div>

  <div class="card" id="login">
    <h2>Vào phòng đấu trí</h2>
    <p class="small">Nhập tên và chọn đội để tham gia.</p>

    <label for="name">Họ và tên</label>
    <input id="name" maxlength="40" placeholder="Nhập họ và tên">

    <label for="team">Đội của bạn</label>
    <select id="team">
      <option value="">Đang tải đội...</option>
    </select>

    <button class="btn" id="enter">Vào trả lời</button>
    <div id="loginStatus" class="status hidden"></div>
  </div>

  <div class="card hidden" id="game">
    <div class="sub" id="num">PHÒNG ĐẤU TRÍ</div>
    <h2 id="question">Đang chờ MC mở câu hỏi...</h2>

    <div id="options"></div>

    <button class="btn" id="send" disabled>
      Gửi đáp án
    </button>

    <div id="result" class="status hidden"></div>

    <p class="small">
      Hãy chọn đáp án và gửi nhanh khi MC mở câu hỏi.
      Quyền trả lời được xác định trên máy chủ.
    </p>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);

let socket = null;
let profile = null;
let currentQuestion = null;
let selectedAnswer = -1;
let sent = false;

function showStatus(id, message) {
  $(id).textContent = message;
  $(id).classList.remove("hidden");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function fillTeams(teams) {
  if (!Array.isArray(teams) || teams.length === 0) return;

  const select = $("team");
  const previous = select.value;

  select.innerHTML = '<option value="">Chọn đội của bạn</option>';

  teams.forEach((team, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = `${team.icon || "★"} ${team.name}`;
    select.appendChild(option);
  });

  if ([...select.options].some(option => option.value === previous)) {
    select.value = previous;
  }
}

async function loadTeams() {
  try {
    const response = await fetch("/api/state", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Máy chủ không phản hồi");
    }

    const data = await response.json();

    if (!Array.isArray(data.teams) || !data.teams.length) {
      throw new Error("Không tìm thấy danh sách đội");
    }

    fillTeams(data.teams);
  } catch (error) {
    $("team").innerHTML =
      '<option value="">Không tải được đội</option>';

    showStatus(
      "loginStatus",
      "Không tải được danh sách đội. Hãy tải lại trang."
    );

    console.error(error);
  }
}

function showQuestion(data) {
  if (!profile || !data) return;

  currentQuestion = data;
  selectedAnswer = -1;
  sent = false;

  $("num").textContent = "CÂU " + (data.no || "");
  $("question").textContent = data.text || "Câu hỏi";

  $("options").innerHTML = "";

  if (Array.isArray(data.answers)) {
    data.answers.forEach((answer, index) => {
      const button = document.createElement("button");
      button.className = "option";
      button.textContent = "ABCD"[index] + ". " + answer;

      button.onclick = () => {
        if (sent) return;

        selectedAnswer = index;

        document.querySelectorAll(".option").forEach(item => {
          item.classList.remove("selected");
        });

        button.classList.add("selected");
        $("send").disabled = false;
      };

      $("options").appendChild(button);
    });
  }

  $("send").disabled = true;
  $("result").classList.add("hidden");
}

function connectSocket() {
  if (typeof io !== "function") {
    showStatus(
      "loginStatus",
      "Không kết nối được máy chủ trò chơi."
    );
    return;
  }

  socket = io({
    reconnection: true,
    reconnectionAttempts: Infinity
  });

  socket.on("connect", () => {
    socket.emit("student-hello");

    if (profile) {
      socket.emit("student-join", profile);
    }

    loadTeams();
  });

  socket.on("team-list", fillTeams);
  socket.on("host-teams", fillTeams);

  socket.on("question-open", showQuestion);

  socket.on("question-closed", () => {
    $("send").disabled = true;
  });

  socket.on("answer-result", data => {
    showStatus(
      "result",
      data?.message || "Máy chủ đã phản hồi."
    );
  });

  socket.on("disconnect", () => {
    if (profile) {
      showStatus(
        "result",
        "Mất kết nối. Đang thử kết nối lại..."
      );
    }
  });
}

$("enter").onclick = () => {
  const name = $("name").value.trim();
  const team = $("team").value;

  if (!name || team === "") {
    showStatus(
      "loginStatus",
      "Vui lòng nhập họ tên và chọn đội."
    );
    return;
  }

  if (!socket || !socket.connected) {
    showStatus(
      "loginStatus",
      "Chưa kết nối máy chủ. Vui lòng thử lại."
    );
    return;
  }

  profile = {
    name: name,
    team: Number(team)
  };

  socket.emit("student-join", profile);

  $("login").classList.add("hidden");
  $("game").classList.remove("hidden");

  $("question").textContent =
    "Đã tham gia! Đang chờ MC mở câu hỏi...";
};

$("send").onclick = () => {
  if (!profile || !currentQuestion || selectedAnswer < 0 || sent) {
    return;
  }

  if (!socket || !socket.connected) {
    showStatus("result", "Mất kết nối. Chưa gửi được đáp án.");
    return;
  }

  sent = true;
  $("send").disabled = true;

  socket.emit("student-answer", {
    questionNo: currentQuestion.no,
    answer: selectedAnswer
  });

  showStatus("result", "Đang gửi đáp án...");
};

loadTeams();
connectSocket();
</script>
</body>
</html>
