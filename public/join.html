<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tham gia - Giờ ra chơi</title><style>
*{box-sizing:border-box}body{background:#102b23;color:#f8efd9;font-family:Arial,sans-serif;margin:0}.wrap{max-width:520px;margin:auto;padding:22px}.card{background:#1d4738;border:2px solid #d6b56e;border-radius:16px;padding:22px;margin-top:18px}h1{color:#e4c477}label{display:block;margin:14px 0 7px}input,select,button{width:100%;padding:13px;border-radius:9px;font-size:16px}input,select{background:#fff9e8;border:1px solid #d6b56e}button{border:0;background:#e4c477;color:#20382c;font-weight:bold;cursor:pointer;margin-top:12px}button:disabled{opacity:.5}.opt{text-align:left;background:#fff9e8}.opt.sel{background:#d7e8c7;outline:3px solid #e4c477}.hidden{display:none}.msg{background:#e8d6a3;color:#1e3529;border-radius:8px;padding:12px;margin-top:14px;line-height:1.5}.muted{color:#c5d4c9;font-size:14px}
</style></head><body><main class="wrap"><h1>GIỜ RA CHƠI</h1><p>ĐẤU TRÍ BẢNG PHẤN · ĐIỆN THOẠI</p><section class="card" id="login"><h2>Vào phòng</h2><label>Họ và tên</label><input id="name" maxlength="40" placeholder="Nhập tên"><label>Đội</label><select id="team"><option>Đang tải đội...</option></select><button id="enter">Tham gia</button><div class="msg hidden" id="loginMsg"></div></section><section class="card hidden" id="game"><p id="num"></p><h2 id="question">Chờ MC mở câu hỏi...</h2><div id="options"></div><button id="send" disabled>Gửi đáp án</button><div id="result" class="msg hidden"></div><p class="muted">5 người trả lời đúng nhanh nhất được 5, 4, 3, 2, 1 điểm. Trả lời sai không có điểm, người tiếp theo được xét.</p></section></main><script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id),socket=io();let profile=null,current=null,selected=-1,sent=false,round=0;const params=new URLSearchParams(location.search);const qrRound=Number(params.get('r')),qrToken=params.get('k')||'';
function msg(id,t){$(id).textContent=t;$(id).classList.remove('hidden')}
function fillTeams(ts){if(!Array.isArray(ts)||!ts.length)return;const old=$('team').value;$('team').innerHTML='<option value="">Chọn đội</option>';ts.forEach((t,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(t.icon||'★')+' '+t.name;$('team').append(o)});if(old)$('team').value=old}
async function loadTeams(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();fillTeams(s.teams);if(s.open&&s.question){round=s.round;if(profile)showQuestion(s.question)}}catch(e){msg('loginMsg','Không tải được đội. Hãy tải lại trang.')}}
function showQuestion(q){if(!profile)return;current=q;selected=-1;sent=false;$('num').textContent='CÂU '+q.no+' · '+(q.subject||'');$('question').textContent=q.text;$('options').replaceChildren();q.answers.forEach((a,i)=>{let b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+'. '+a;b.onclick=()=>{if(sent)return;selected=i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('send').disabled=false};$('options').append(b)});$('send').disabled=true;$('result').classList.add('hidden')}
socket.on('connect',()=>{socket.emit('student-hello');if(profile)socket.emit('student-join',profile);loadTeams()});socket.on('team-list',fillTeams);socket.on('host-teams',fillTeams);socket.on('state',s=>{round=s.round;if(profile&&s.open&&s.question&&(!current||current.no!==s.question.no))showQuestion(s.question);if(!s.open)$('send').disabled=true});socket.on('question-open',showQuestion);socket.on('question-closed',()=>{$('send').disabled=true});socket.on('answer-result',r=>msg('result',r.message));
$('enter').onclick=()=>{let name=$('name').value.trim(),team=$('team').value;if(!name||team==='')return msg('loginMsg','Nhập tên và chọn đội.');if(!qrToken||!qrRound)return msg('loginMsg','Hãy quét mã QR trên màn hình MC để vào đúng câu.');profile={name,team:Number(team)};socket.emit('student-join',profile);$('login').classList.add('hidden');$('game').classList.remove('hidden');loadTeams()};
$('send').onclick=()=>{if(!current||selected<0||sent)return;sent=true;$('send').disabled=true;socket.emit('student-answer',{questionNo:current.no,round:qrRound,token:qrToken,answer:selected});msg('result','Đã gửi, đang chờ máy chủ chấm...')};loadTeams();
</script></body></html>
