<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tham gia — Giờ ra chơi</title><style>
*{box-sizing:border-box}body{margin:0;background:#102b23;color:#f8efd9;font-family:Georgia,serif}.wrap{max-width:520px;margin:auto;padding:18px}.brand{color:#e4c477;font-size:26px;font-weight:bold;letter-spacing:1px}.sub{font-size:12px;letter-spacing:2px;color:#c6d5c8}.card{background:#1d4738;border:3px solid #927247;box-shadow:inset 0 0 0 2px #d1b16a;border-radius:18px;padding:20px;margin-top:16px}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;color:#e6d5a9}.field input,.field select{width:100%;padding:13px;border:1px solid #c4a568;border-radius:9px;background:#fff8e7;color:#20382c;font-size:16px}.btn{width:100%;padding:14px;background:#e4c477;border:0;border-radius:10px;color:#1e382b;font-weight:bold;font-size:16px;margin-top:12px}.opts{display:grid;gap:10px}.opt{background:#f8efd9;color:#213a2c;padding:14px;border-radius:10px;text-align:left;border:2px solid transparent;font-size:16px}.opt b{color:#a64f42;margin-right:8px}.opt.sel{border-color:#e4c477;background:#d8e8c9}.status{padding:12px;border-radius:8px;background:#ead8a8;color:#26382c;margin-top:12px}.small{font-size:12px;line-height:1.5;color:#c8d5c9}.hidden{display:none!important}</style></head><body><div class="wrap"><div class="brand">GIỜ RA CHƠI</div><div class="sub">ĐẤU TRÍ BẢNG PHẤN · ĐIỆN THOẠI</div>
<div class="card"><h2>Vào phòng đấu trí</h2><p class="small">Nhập tên, chọn đội và chờ MC mở câu hỏi.</p><div class="field"><label>Họ và tên</label><input id="name" maxlength="40" placeholder="Nhập họ và tên"></div><div class="field"><label>Đội của bạn</label><select id="team"><option value="">Đang tải đội...</option></select></div><button class="btn" id="enter">Vào trả lời</button><div id="status" class="status hidden"></div></div>
<div class="card hidden" id="game"><div class="sub" id="num">CÂU HỎI</div><h2 id="q">Đang chờ MC mở câu hỏi…</h2><div class="opts" id="opts"></div><button class="btn" id="send" disabled>Gửi đáp án</button><div id="result" class="status hidden"></div><p class="small">Mỗi câu chỉ nhận 5 lượt gửi đầu tiên. Một người chỉ gửi một lần mỗi câu.</p></div>
<script src="/socket.io/socket.io.js"></script><script>
const socket=io();const $=x=>document.getElementById(x);let profile=null,q=null,choice=-1,sent=false;
socket.on("connect",()=>socket.emit("student-hello"));socket.on("team-list",teams=>fillTeams(teams));socket.on("host-teams",teams=>fillTeams(teams));
function fillTeams(ts){let old=$("team").value;$("team").innerHTML='<option value="">Chọn đội</option>'+ts.map((t,i)=>`<option value="${i}">${esc(t.icon||"★")} ${esc(t.name)}</option>`).join("");if(old!=="")$("team").value=old}
$("enter").onclick=()=>{let name=$("name").value.trim(),team=$("team").value;if(!name||team===""){$("status").textContent="Vui lòng nhập tên và chọn đội.";$("status").classList.remove("hidden");return}profile={name,team:Number(team)};socket.emit("student-join",profile);$("status").textContent="Đã vào phòng. Chờ MC mở câu hỏi.";$("status").classList.remove("hidden");$("game").classList.remove("hidden")};
socket.on("question-open",data=>{if(!profile)return;q=data;choice=-1;sent=false;$("num").textContent="CÂU "+String(q.no).padStart(2,"0");$("q").textContent=q.text;$("opts").innerHTML=q.answers.map((a,i)=>`<button class="opt" data-i="${i}"><b>${"ABCD"[i]}.</b>${esc(a)}</button>`).join("");$("opts").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(sent)return;choice=Number(b.dataset.i);$("opts").querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));$("send").disabled=false});$("send").disabled=false;$("result").classList.add("hidden")});
$("send").onclick=()=>{if(!profile||!q||choice<0||sent)return;sent=true;$("send").disabled=true;socket.emit("student-answer",{questionNo:q.no,answer:choice});$("result").textContent="Đang gửi đáp án…";$("result").classList.remove("hidden")};
socket.on("answer-result",r=>{$("result").textContent=r.message;$("result").classList.remove("hidden")});socket.on("question-closed",()=>{$("send").disabled=true});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></div></body></html>
